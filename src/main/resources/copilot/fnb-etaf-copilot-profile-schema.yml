# Documentation schema for the one central FNB-ETAF Copilot profile.
# The Java CopilotProfileLoader enforces this contract at runtime.
# Keep this schema and fnb-etaf-copilot-profile.yml together in the dependency JAR.
allowed_top_level_keys:
  - version
  - repository_instruction
  - discovery_policy
  - path_instructions
version:
  type: string
  required: true
  description: Human-readable generated-guidance version.
repository_instruction:
  type: multiline-string
  required: true
  output: .github/copilot-instructions.md
  description: Repository-wide FNB-ETAF rules for GitHub Copilot and IntelliJ Copilot Chat.
path_instructions:
  type: map-of-multiline-string
  required: true
  output_directory: .github/instructions
  output_file_suffix: .instructions.md
  description: Path-specific instruction content. Each value must begin with YAML front matter containing applyTo.
discovery_policy:
  type: mapping
  required: true-for-bundled-profile
  description: >-
    Central policy for an optional local IntelliJ Playwright MCP template and FNB-ETAF review-only
    discovery drafts. This policy does not start an MCP server, connect to a browser, resolve a URL,
    or alter normal framework behavior.
  required_keys:
    - draft_output_directory
    - mcp_template_output_path
    - mcp_server_name
    - playwright_mcp_package
    - default_browser
    - default_headless
    - idle_timeout_millis
    - console_level
    - allowed_locator_types
    - allowed_actions
    - maximum_candidates
  fields:
    draft_output_directory:
      type: relative-path
      required_prefix: .fnb-etaf/discovery-drafts
      description: Only directory where review drafts may be written.
    mcp_template_output_path:
      type: relative-path
      required_prefix: .fnb-etaf/copilot
      description: Only path where the disabled local IntelliJ mcp.json template may be written.
    mcp_server_name:
      type: identifier
      description: Local-only MCP server display name.
    playwright_mcp_package:
      type: npm-package-version
      pattern: '@playwright/mcp@x.y.z'
      description: Pinned package used in the local template; do not use latest.
    default_browser:
      enum: [chrome, msedge, firefox, webkit]
    default_headless:
      type: boolean
      required_value: true
      description: The local discovery template is headless by policy; use a separately approved process for headed browser inspection.
    idle_timeout_millis:
      type: integer
      minimum: 30000
      maximum: 3600000
    console_level:
      enum: [error, warning, info]
    allowed_locator_types:
      type: non-empty-string-list
      description: Locator types supported by FNB-ETAF LocatorHandler and approved for draft rendering.
    allowed_actions:
      enum-list: [click, verify_visible, verify_enabled, verify_exists]
      description: Review-only page actions; input, submission, authentication, download/upload, frame, and popup actions are intentionally excluded.
    maximum_candidates:
      type: integer
      minimum: 1
      maximum: 100
safety_rules:
  - Only .github/copilot-instructions.md and .github/instructions/**/*.instructions.md may be generated by CopilotInstructionTool.
  - Only .fnb-etaf/copilot/mcp.json and .fnb-etaf/discovery-drafts/** may be generated by CopilotDiscoveryTool.
  - Paths must stay within the consumer repository root and existing local draft files are never overwritten.
  - Do not include bearer tokens, JWTs, credentials, sensitive assignments, literal internal HTTP endpoints, target URLs, page source, screenshots, videos, reports, or test evidence.
  - A draft target alias is verified in memory using normal `environments.<env>.<alias>` precedence and then the ordinary configuration key/path; its resolved value is never printed or written.
  - Generated discovery files are review-only and must not modify active locators, feature files, normal configuration, Hooks, BrowserFactory, runners, reports, or tests.
  - This profile is guidance and local draft configuration only; it must not affect normal test execution.
