# ==========================================================
# PTAF Native Mobile Appium Configuration
# ==========================================================
# This file controls native Android/iOS application automation only.
# Mobile browser/resolution testing is configured separately under mobile_browser/config.
#
# Enterprise usage notes:
# - Keep app paths relative to the project root so every tester can run the same config.
# - Leave iOS bundle_id blank when launching by .app path; Appium can detect the bundle id.
# - Set orientation to portrait or landscape. This is applied as a session capability and
#   also attempted after session creation for devices/simulators that support runtime rotation.
# - Screen recording is optional because it can slow down local emulators/simulators.

mobile:
  enabled: true
  appium_server_url: "http://127.0.0.1:4723"
  default_platform: "android"
  implicit_wait_seconds: 0
  explicit_wait_seconds: 30
  new_command_timeout_seconds: 120

  evidence:
    output_directory: "test-output/mobile-evidence"
    screenshot_on_failure: true
    screenshot_on_pass: false
    screenshot_after_each_scenario: false
    attach_screenshots_to_report: true
    video_recording_enabled: false
    video_on_failure_only: false
    attach_video_to_report: false

  android:
    automation_name: "UiAutomator2"
    platform_name: "Android"
    device_name: "Android Emulator"
    platform_version: ""
    orientation: "portrait"
    app: "src/test/resources/mobile/apps/TheApp.apk"
    app_package: "com.appiumpro.the_app"
    app_activity: ".MainActivity"
    no_reset: false
    full_reset: false

  ios:
    automation_name: "XCUITest"
    platform_name: "iOS"
    device_name: "iPhone 15"
    platform_version: ""
    orientation: "portrait"
    app: "src/test/resources/mobile/apps/ios-unzipped/TheApp.app"
    # Keep this blank when using the sample .app path. If you need an explicit value,
    # run: /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" src/test/resources/mobile/apps/ios-unzipped/TheApp.app/Info.plist
    bundle_id: ""
    no_reset: false
    full_reset: false
