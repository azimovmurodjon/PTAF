# THE_APP_TEST_CONFIG
  android:
    automation_name: "UiAutomator2"
    platform_name: "Android"
    device_name: "Android Emulator"
    platform_version: ""
    udid: ""
    orientation: "portrait"

    app: "src/test/resources/mobile/apps/TheApp.apk"
    app_package: ""
    app_activity: ""

    app_wait_package: ""
    app_wait_activity: ""
    system_port: ""
    adb_exec_timeout: ""
    auto_grant_permissions: "true"

    no_reset: false
    full_reset: false

  ios:
    automation_name: "XCUITest"
    platform_name: "iOS"
    device_name: "iPhone 15"
    udid: ""
    platform_version: ""
    orientation: "portrait"

    # iOS native app artifact and launch details.
    # Leave bundle_id blank when launching a simulator .app path and Appium can detect it.
    # Use bundle_id for installed-app launches or real-device IPA flows when required.
#    app: "src/test/resources/mobile/apps/Payload/FIPhoneXR.app"
    app: "src/test/resources/mobile/apps/ios-unzipped/TheApp.app"
    bundle_id: ""

    # Native iOS app alert handling. Keep false for controlled consent testing.
    auto_accept_alerts: "false"
    auto_dismiss_alerts: "false"

    # Optional iOS/WebDriverAgent capabilities for real devices or unstable simulators.
    include_safari_in_webviews: "false"
    connect_hardware_keyboard: "false"
    xcode_org_id: ""
    xcode_signing_id: ""
    updated_wda_bundle_id: ""
    wda_local_port: ""
    wda_startup_retries: ""
    wda_startup_retry_interval: ""
    wda_launch_timeout: ""
    wda_connection_timeout: ""
    wait_for_idle_timeout: ""
    app_launch_state_timeout_sec: ""
    use_new_wda: ""
    show_xcode_log: ""
    enforce_app_install: ""

    no_reset: false
    full_reset: false
