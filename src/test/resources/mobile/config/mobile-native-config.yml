# ==========================================================
# PTAF Native Mobile Appium Capability Configuration
# ==========================================================
# Purpose:
# - This file is dedicated to native Android/iOS application automation.
# - It intentionally contains ONLY native app capabilities under mobile.android
#   and mobile.ios.
# - Shared framework settings live in mobile-config.yml.
# - Appium real browser settings live in mobile-browser-config.yml.
#
# Native app artifact rules:
# - Android emulator/device: use .apk
# - iOS Simulator: use simulator-built .app
# - Real iPhone/iPad: use signed .ipa with ios.udid and signing/WDA settings

