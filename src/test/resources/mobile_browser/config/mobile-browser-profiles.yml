# ==========================================================
# PTAF Playwright Mobile Browser Emulation Profiles
# ==========================================================
# Use these names in src/test/resources/config/config.yml under the existing browser key.
# Example: browser: "iPhone 17 Pro Max Safari"
# This is browser emulation for responsive web testing; it does not launch native simulators.

