###############################################################################
# Extent Reports ? FNB-PTAF (Non-Overwriting, Timestamped Runs)
# Each execution writes to its own timestamped directory to avoid overrides.
###############################################################################

# =========================
# Dynamic Base Folder (ON)
# =========================
# Creates a fresh run folder under basefolder.name using basefolder.datetimepattern.
# Example: reports/09-Oct-25_14-33-10/
basefolder.name=test-output/
basefolder.datetimepattern=dd-MMM-yy_HH-mm-ss

# Optional: put all output under test-output/ instead of project root
# (Uncomment both lines below if you prefer test-output/)
# basefolder.name=test-output/reports/
# basefolder.datetimepattern=dd-MMM-yy_HH-mm-ss

# =========================
# Spark Reporter (HTML)
# =========================
extent.reporter.spark.start=true
# With basefolder enabled, this path is relative to the new run folder:
extent.reporter.spark.out=SparkReport/Spark.html
extent.reporter.spark.config=src/test/resources/extent-config.xml
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log
extent.reporter.spark.theme=standard   # Options: standard, dark

# =========================
# Base64 Reporter (HTML)
# =========================
extent.reporter.base64.start=true
extent.reporter.base64.out=Base64Report/Report.html

# =========================
# PDF Reporter
# =========================
extent.reporter.pdf.start=true
extent.reporter.pdf.out=PdfReport/FNB-PTAF-Report.pdf

# =========================
# Legacy AventStack HTML (optional)
# =========================
# extent.reporter.html.start=false
# extent.reporter.html.out=HtmlReport/Report.html

# =========================
# JSON Reporter (optional)
# =========================
# extent.reporter.json.start=false
# extent.reporter.json.out=JsonReport/Report.json

# =========================
# ExtentX Server (optional)
# =========================
# extent.reporter.extentx.start=true
# extent.reporter.extentx.config=src/test/resources/extent-x-config.xml
# extent.reporter.extentx.out=ExtentX/
# extent.reporter.extentx.url=http://localhost:1337

# =========================
# Screenshots
# =========================
# These are relative to the timestamped run folder.
# Example final path: reports/09-Oct-25_14-33-10/screenshots/...
screenshot.dir=screenshots/
screenshot.rel.path=../screenshots/

# =========================
# System / Project Info
# =========================
systeminfo.os=Windows
systeminfo.user=MJ
systeminfo.build=1.1
systeminfo.AppName=FNB-PTAF
systeminfo.Java=11
systeminfo.Environment=QA

###############################################################################
