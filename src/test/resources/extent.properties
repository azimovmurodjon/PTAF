# =====================================================================
# ExtentX Server
# =====================================================================
# extent.reporter.extentx.start=true
# extent.reporter.extentx.config=src/test/resources/extent-x-config.xml
# extent.reporter.extentx.out=test-output/ExtentX/
# extent.reporter.extentx.url=http://localhost:1337

# =====================================================================
# Spark Reporter (HTML) - Your primary, rich HTML report
# =====================================================================
extent.reporter.spark.start=true
extent.reporter.spark.out=test-output/SparkReport/Spark.html
extent.reporter.spark.config=src/test/resources/extent-config.xml
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log
extent.reporter.spark.theme=standard # Options: standard, dark

# =====================================================================
# Base64 Reporter (HTML) - Embeds screenshots directly into the HTML
# =====================================================================
extent.reporter.base64.start=true
extent.reporter.base64.out=test-output/Base64Report/Report.html

# =====================================================================
# PDF Reporter - For generating PDF summaries
# =====================================================================
extent.reporter.pdf.start=false
extent.reporter.pdf.out=test-output/PdfReport/FNB-PTAF-Report.pdf

# =====================================================================
# Aventstack HTML Reporter (Legacy) - Another HTML report option
# =====================================================================
# extent.reporter.html.start=false
# extent.reporter.html.out=test-output/HtmlReport/Report.html

# =====================================================================
# JSON Reporter - For data export and integration
# =====================================================================
# extent.reporter.json.start=false
# extent.reporter.json.out=test-output/JsonReport/Report.json

# =====================================================================
# Screenshot and Folder Configuration
# =====================================================================
screenshot.dir=test-output/screenshots/
screenshot.rel.path=../screenshots/
# The 'basefolder' properties allow for timestamped report directories
# basefolder.name=reports/
# basefolder.datetimepattern=d-MMM-YY_HH-mm-ss

# =====================================================================
# System and Project Information - Displayed in the report dashboard
# =====================================================================
systeminfo.os=Windows
systeminfo.user=MJ
systeminfo.build=1.1
systeminfo.AppName=FNB-PTAF
systeminfo.Java=11 # Example: Java version
systeminfo.Environment=QA # Example: Test environment